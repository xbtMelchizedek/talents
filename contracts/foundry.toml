[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200


[fuzz]
runs = 512

# Stateful suites (test/invariant) use handlers that never revert, as in morpho-blue,
# so any revert inside a handler is a bug, not noise.
[invariant]
runs = 256
depth = 64
fail_on_revert = true

# CI runs more cases. Locally: FOUNDRY_PROFILE=ci forge test
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 64
fail_on_revert = true
